name: Sync Wiki to GitHub Wiki

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'wiki/**'

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync wiki folder to GitHub Wiki
        env:
          ACTION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${ACTION_TOKEN}@github.com/${{ github.repository }}.wiki.git wiki-repo
          cp -R wiki/*.md wiki-repo/
          cd wiki-repo
          git add .
          if git diff --staged --quiet; then
            echo "Nessuna modifica da sincronizzare sulla Wiki."
          else
            git commit -m "docs(wiki): auto-sync from codebase [skip ci]"
            git push origin master
          fi
