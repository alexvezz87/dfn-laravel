name: Deploy to Google Cloud Run (Staging)

on:
  push:
    branches:
      - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  GAR_REPOSITORY: ${{ secrets.GCP_GAR_REPOSITORY || 'dfn-laravel' }}
  SERVICE_NAME: dfn-laravel-staging
  IMAGE_NAME: dfn-laravel

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push & Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Autenticazione su Google Cloud (Supporta sia Service Account Key che Workload Identity Federation)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          if ! gcloud artifacts repositories describe ${{ env.GAR_REPOSITORY }} --location=${{ env.REGION }} --quiet >/dev/null 2>&1; then
            gcloud artifacts repositories create ${{ env.GAR_REPOSITORY }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --description="Docker repository for ${{ env.SERVICE_NAME }}" \
              --quiet
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
          env_vars: |
            APP_ENV=staging
            APP_DEBUG=false
            DB_CONNECTION=mysql
            DB_HOST=${{ secrets.STAGING_DB_HOST || 'gateway01.eu-central-1.prod.aws.tidbcloud.com' }}
            DB_PORT=${{ secrets.STAGING_DB_PORT || '4000' }}
            DB_DATABASE=${{ secrets.STAGING_DB_DATABASE || 'dfn_laravel' }}
            DB_USERNAME=${{ secrets.STAGING_DB_USERNAME || '44TAgT2sNGA1Pni.root' }}
            DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD || 'W8tj0eXmd8X1xoOD' }}
            MYSQL_ATTR_SSL_CA=/etc/ssl/certs/ca-certificates.crt

      - name: Show Deployed Cloud Run Service URL
        run: |
          echo "===================================================="
          echo "Deployment completed successfully!"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          echo "===================================================="
